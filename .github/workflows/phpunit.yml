name: PHPUnit

on:
  push:
    branches: [ "main", "adresy-pr" ]
  pull_request:
    branches: [ "main" ]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
      - name: Install dependencies (if composer.json exists)
        run: |
          if [ -f composer.json ]; then
            composer install --no-progress --prefer-dist
          else
            echo "composer.json not found — skipping composer install"
          fi
      - name: Run tests (if phpunit available)
        run: |
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit -c phpunit.xml.dist --colors=always
          else
            echo "phpunit binary not found — skipping tests"
          fi


